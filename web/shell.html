<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Mailbox tracker</title>
<style>
:root {
  color-scheme: light dark;
  --font-anthropic-sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-anthropic-serif: Georgia, "Times New Roman", serif;
  --cds-font-size-title: 1.75rem; --cds-font-size-heading: 1.05rem; --cds-font-size-body: .9375rem; --cds-font-size-caption: .8125rem;
  --cds-font-weight-medium: 600;
  --cds-gap-xs: 4px; --cds-gap-sm: 8px; --cds-gap-md: 16px; --cds-gap-lg: 24px;
  --cds-pad-xs: 4px; --cds-pad-sm: 8px; --cds-pad-md: 14px; --cds-pad-lg: 18px;
  --cds-radius: 8px; --cds-dur-fast: .15s; --cds-dur-slow: .3s; --cds-ease-out: cubic-bezier(.2, .8, .2, 1);
  --color-bg: #f6f6f3; --color-panel: #ffffff; --color-fg: #1d1d1b; --color-fg-muted: #6b6b66; --color-border-line: #e2e1dc;
  --color-ok: #1f8a4c; --color-bad: #c43c3c;
  --cds-surface-popover: #ffffff; --cds-border: #e2e1dc; --cds-shadow-popover: 0 6px 24px rgba(0,0,0,.12); --cds-text-secondary: #6b6b66;
  --cds-chart-grid: #ecebe6; --cds-chart-axis: #c9c8c2; --cds-chart-reference: #8a8a84; --cds-chart-status-critical: #d6455b; --cds-chart-muted: #d5d4cf;
}
@media (prefers-color-scheme: dark) {
  :root {
    --color-bg: #1b1b1a; --color-panel: #252524; --color-fg: #ecebe6; --color-fg-muted: #a3a29c; --color-border-line: #3a3a38;
    --color-ok: #4cc283; --color-bad: #ef6b6b;
    --cds-surface-popover: #2c2c2b; --cds-border: #3a3a38; --cds-shadow-popover: 0 6px 24px rgba(0,0,0,.5); --cds-text-secondary: #a3a29c;
    --cds-chart-grid: #333331; --cds-chart-axis: #4a4a47; --cds-chart-reference: #8f8e88; --cds-chart-muted: #4a4a47;
  }
}
html, body { margin: 0; background: var(--color-bg); color: var(--color-fg); }
#dash-root { max-width: 1240px; margin: 0 auto; padding: 24px 16px 48px; box-sizing: border-box; }
.dash-skeleton { color: transparent !important; background: var(--color-border-line); border-radius: 4px; }
.sv-status { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; font: var(--cds-font-size-caption)/1.4 var(--font-anthropic-sans); color: var(--color-fg-muted); margin-bottom: 12px; }
.sv-status a { color: inherit; }
.sv-btn { font: 600 var(--cds-font-size-body) var(--font-anthropic-sans); color: #fff; background: #2f6fdb; border: 0; border-radius: var(--cds-radius); padding: 7px 16px; cursor: pointer; }
.sv-btn:hover { background: #2559b3; } .sv-btn:disabled { opacity: .6; cursor: progress; }
.sv-btn:focus-visible { outline: 2px solid var(--color-fg); outline-offset: 2px; }
.sv-err { color: var(--color-bad); }
</style>
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script src="dash.js"></script>
</head>
<body>
<div id="dash-root">
<div class="sv-status" id="sv-status">
  <button class="sv-btn" id="sv-update" type="button">Update now</button>
  <span id="sv-refresh">Checking when the data was last refreshed…</span>
  <a href="admin">Admin</a>
</div>
<!--PAGE-->
</div>
<script>
(() => {
  const el = document.getElementById('sv-refresh'), btn = document.getElementById('sv-update');
  const when = (iso) => new Date(iso).toLocaleString('en-IN', { timeZone: 'Asia/Kolkata', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
  const getStatus = () => fetch('status', { cache: 'no-store' }).then((r) => r.json());
  const show = (s) => {
    el.className = '';
    if (s.busy) { el.textContent = 'Updating: collecting new emails and rebuilding…'; return; }
    if (s.last_error && (!s.last_run || s.last_error.at > s.last_run)) { el.className = 'sv-err'; el.textContent = s.last_error.message; return; }
    if (!s.last_run) { el.textContent = 'No update has run yet. Press Update now.'; return; }
    const r = s.last_result || {};
    el.textContent = `Last updated ${when(s.last_run)} IST` + (r.fetched != null ? ` · ${r.new_emails_added ?? 0} new emails` : '') + (r.as_of ? ` · emails up to ${r.as_of}` : '');
  };
  getStatus().then(show).catch(() => { el.textContent = ''; });

  btn.addEventListener('click', async () => {
    btn.disabled = true;
    el.className = ''; el.textContent = 'Updating: collecting new emails and rebuilding… (usually under a minute)';
    try {
      const before = (await getStatus()) || {};
      const r = await fetch('admin/refresh', { method: 'POST', headers: { 'X-Dashboard': '1' } });
      if (!r.ok && r.status !== 409) throw new Error((await r.json().catch(() => ({}))).message || r.statusText);
      const started = Date.now();
      let s = before;
      while (Date.now() - started < 15 * 60 * 1000) {
        await new Promise((res) => setTimeout(res, 3000));
        s = await getStatus();
        const finished = !s.busy && (s.last_run !== before.last_run || (s.last_error && s.last_error.at !== before.last_error?.at));
        if (finished) break;
      }
      show(s);
      if (!s.last_error || s.last_run > s.last_error.at) window.dash.refresh();
    } catch (e) {
      el.className = 'sv-err'; el.textContent = 'Update failed: ' + e.message;
    } finally {
      btn.disabled = false;
    }
  });
})();
</script>
</body>
</html>
